id = "0rz0rz0rz/umbriel-settings"
name = "Umbriel Settings"
version = "0.1.4"
plugin_api = 43
author = "0rz0rz0rz"
license = "MIT"
icon = "settings"
description = "Edit every Umbriel setting, rule and keybind, plus XDG user folders and default apps, with review and backups."
dependencies = ["python3", "python-tomlkit", "umbriel", "zenity", "kdialog", "gio", "xdg-open"]
tags = ["umbriel", "panel", "bar", "system", "utility"]

[[widget]]
id = "settings"
entry = "bar.luau"

  [[widget.setting]]
  key = "display"
  type = "select"
  label_key = "settings.display.label"
  description_key = "settings.display.description"
  default = "icon"
  options = [
    { value = "icon", label_key = "settings.display.options.icon" },
    { value = "icon_text", label_key = "settings.display.options.icon_text" },
    { value = "text", label_key = "settings.display.options.text" },
  ]

[[panel]]
id = "folders"
entry = "panel.luau"
width = 980
height = 760
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = false
capture_keys = ["ctrl+f", "ctrl+s", "alt+Left"]
