id = "umbriel-settings/Umbriel-GUI-Plugin"
name = "Umbriel Settings"
version = "0.2.0"
plugin_api = 43
author = "umbriel-settings"
description = "Edit every Umbriel setting, rule and keybind, plus user folders and default applications, with search, review and backups."
dependencies = ["python3", "python-tomlkit"]

[[widget]]
id = "settings"
entry = "bar.luau"

  [[widget.setting]]
  key = "display"
  type = "select"
  label_key = "settings.display.label"
  description_key = "settings.display.description"
  default = "icon_text"
  options = [
    { value = "icon_text", label_key = "settings.display.options.icon_text" },
    { value = "icon", label_key = "settings.display.options.icon" },
    { value = "text", label_key = "settings.display.options.text" },
  ]

[[panel]]
id = "folders"
entry = "panel.luau"
width = 980
height = 760
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
dismiss_on_outside_click = false
capture_keys = ["ctrl+f", "ctrl+s", "alt+Left"]
